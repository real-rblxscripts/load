<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .text-box {
            width: 100%;
            height: 200px;
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        .text-box:focus {
            border-color: #38bdf8;
        }

        .scripts-section {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
        }

        .scripts-title {
            font-size: 18px;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 12px;
            text-transform: capitalize;
        }

        .script-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .script-code {
            font-family: monospace;
            font-size: 13px;
            color: #38bdf8;
            word-break: break-all;
        }

        .copy-btn {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s ease;
        }

        .copy-btn:hover {
            background-color: #0369a1;
        }

        .copy-btn.copied {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="container">
        <textarea class="text-box" readonly>This page is actually for being used for loadstring, to get code for a script, do https://raw.githubusercontent.com/eokpr/load/obfuscated/name</textarea>

        <div class="scripts-section">
            <h2 class="scripts-title">Available Scripts</h2>
            <div class="script-card">
                <code class="script-code" id="script1">loadstring(game:HttpGet("https://raw.githubusercontent.com/real-rblxscripts/load/obfuscated/Event-Explorer"))()</code>
                <button class="copy-btn" onclick="copyScript('script1', this)">Copy</button>
            </div>
        </div>
    </div>

    <script>
        function copyScript(elementId, btn) {
            const textToCopy = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                btn.innerText = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerText = 'Copy';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>

</body>
</html>
