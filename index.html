<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .text-box {
            width: 100%;
            height: 200px;
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        .text-box:focus {
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <textarea class="text-box" readonly>This page is actually for being used for loadstring, to get code for a script, do https://raw.githubusercontent.com/eokpr/load/main/name</textarea>
    </div>

</body>
</html>
